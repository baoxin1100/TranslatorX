<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">TranslatorX 紧凑深色界面</title>
  <desc id="desc">单列实时窗口 OCR 翻译工具，软件名位于标题栏中央，下方是三组配置和蓝色运行按钮。</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .primary { fill: #f3f6f8; }
      .secondary { fill: #a6b0bd; }
      .muted { fill: #748090; }
      .label { fill: #a6b0bd; font-size: 14px; font-weight: 600; }
      .hint { fill: #748090; font-size: 12px; }
      .value { fill: #f3f6f8; font-size: 15px; font-weight: 500; }
      .tiny { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#090b0f"/>
  <rect x="330" y="110" width="540" height="580" rx="19" fill="#10141a" stroke="#28313d" filter="url(#shadow)"/>

  <!-- compact titlebar -->
  <path d="M330 162H870" stroke="#28313d"/>
  <circle cx="355" cy="136" r="4" fill="#3b82f6"/>
  <text x="367" y="140" class="muted" font-size="12">准备就绪</text>
  <text x="600" y="141" class="primary" font-size="15" font-weight="700" text-anchor="middle">TranslatorX</text>
  <circle cx="808" cy="136" r="16" fill="#151a22" stroke="#28313d"/>
  <circle cx="808" cy="136" r="4.5" fill="none" stroke="#a6b0bd" stroke-width="1.4"/>
  <path d="M808 127v3m0 12v3m-9-9h3m12 0h3m-15-6 2 2m8 8 2 2m0-12-2 2m-8 8-2 2" stroke="#a6b0bd" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="844" cy="136" r="16" fill="#151a22" stroke="#28313d"/>
  <path d="m838 130 12 12m0-12-12 12" stroke="#a6b0bd" stroke-width="1.7" stroke-linecap="round"/>

  <!-- engine -->
  <text x="354" y="205" class="label">翻译引擎</text>
  <text x="846" y="205" class="hint" text-anchor="end">自动检测可用服务</text>
  <rect x="354" y="217" width="492" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <text x="369" y="246" class="value">谷歌翻译</text>
  <path d="m818 235 6 6 6-6" fill="none" stroke="#a6b0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- target window -->
  <text x="354" y="304" class="label">目标窗口</text>
  <text x="846" y="304" class="hint" text-anchor="end">检测到 3 个窗口</text>
  <rect x="354" y="316" width="436" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <text x="369" y="345" class="value">Cyberpunk 2077</text>
  <path d="m762 334 6 6 6-6" fill="none" stroke="#a6b0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="800" y="316" width="46" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <path d="M835 338a10 10 0 0 0-18-5m0-6v7h7M812 341a10 10 0 0 0 18 5m0 6v-7h-7" fill="none" stroke="#a6b0bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- standalone language fields -->
  <text x="354" y="403" class="label">源语言</text>
  <text x="633" y="403" class="label">目标语言</text>
  <rect x="354" y="415" width="213" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <text x="369" y="444" class="value">自动检测</text>
  <path d="m540 433 6 6 6-6" fill="none" stroke="#a6b0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="633" y="415" width="213" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <text x="648" y="444" class="value">简体中文</text>
  <path d="m819 433 6 6 6-6" fill="none" stroke="#a6b0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- layout -->
  <text x="354" y="501" class="label">译文布局</text>
  <text x="846" y="501" class="hint" text-anchor="end">自动限制在窗口范围内</text>
  <rect x="354" y="513" width="492" height="46" rx="10" fill="#151a22" stroke="#28313d"/>
  <text x="369" y="542" class="value">下方布局</text>
  <path d="m818 531 6 6 6-6" fill="none" stroke="#a6b0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- primary action -->
  <rect x="354" y="585" width="492" height="54" rx="11" fill="#3b82f6"/>
  <text x="575" y="617" fill="#ffffff" font-size="15" font-weight="750" text-anchor="middle">开始实时翻译</text>
  <rect x="681" y="599" width="87" height="27" rx="6" fill="none" stroke="#8ab7ff"/>
  <text x="724" y="617" fill="#dceaff" font-size="11" font-weight="650" text-anchor="middle">Ctrl + Enter</text>

  <text x="600" y="666" class="muted" font-size="12" text-anchor="middle">紧凑单窗口 · 目标窗口失焦时自动隐藏译文</text>
</svg>
