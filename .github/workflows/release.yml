name: Build PyAppify
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "baoxin1100@users.noreply.github.com"
          git config --global user.name "baoxin1100"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and verify application
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_ocr.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sync Repositories # 同步部分代码(deploy.txt中), 合并tag中间更新日志, 到更新库, 以减少用户更新使用的git库大小
        id: sync
        if: startsWith(github.ref, 'refs/tags/')
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/baoxin1100/TranslatorX
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true # 在更新日志中加入作者
      - name: Prepare application icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force icons
          Copy-Item assets/translatorx.ico icons/icon.ico
          Copy-Item assets/translatorx-icon.png icons/icon.png
      - name: Build launcher and installers
        uses: ok-oldking/pyappify-action@c5cc8fe5c9bd5c732969018694a2645474c48b7e
        with:
          version: v1.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Include launcher source and checksums
        shell: pwsh
        run: |
          # The action modifies this source tree to brand the GPL launcher.
          $source = Join-Path $env:RUNNER_TEMP 'p'
          git -C $source diff --binary | Out-File pyappify_dist/launcher-branding.patch -Encoding utf8
          git -C $source archive --format=zip --output="$env:GITHUB_WORKSPACE/pyappify_dist/pyappify-v1.2.3-source.zip" HEAD
          Copy-Item "$source/LICENSE.txt" pyappify_dist/PYAPPIFY-LICENSE.txt
          # Freeze the input list before creating SHA256SUMS.txt. Otherwise the
          # output file can enter the pipeline while it is still open for writing.
          $files = @(Get-ChildItem pyappify_dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name)
          $checksums = @(foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          })
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'pyappify_dist/SHA256SUMS.txt'),
            [string[]] $checksums,
            [Text.Encoding]::ASCII
          )
      - uses: actions/upload-artifact@v4
        with:
          name: TranslatorX-windows-${{ github.ref_name }}
          path: pyappify_dist/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}:

            ${{ steps.sync.outputs.changes_with_asterisk }}

            ## 下载包说明

            - [**TranslatorX-win32-release-setup.exe**](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TranslatorX-win32-release-setup.exe) 完整安装包，更新使用腾讯 CNB。

            ## 如果无法下载或下载较慢，可以使用其他下载源

            - **夸克网盘：** https://pan.quark.cn/s/432e4b2e720e?pwd=cag7 （提取码 `cag7`）
            - **百度网盘：** https://pan.baidu.com/s/13x2SXP3ww8gCaJBm2TOvYQ?pwd=tran （提取码 `tran`）
          files: pyappify_dist/*
          fail_on_unmatched_files: true
